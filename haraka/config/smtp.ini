; Haraka SMTP settings
; listen on port 25 on all IPv4 and IPv6 addresses
listen=0.0.0.0:25

; running in a container, do not drop privileges
;user=smtp
;group=smtp

; use all CPU cores
nodes=cpus

; TLS disabled (local development)
; production:
; tls_key=/app/tls/tls_key.pem
; tls_cert=/app/tls/tls_cert.pem
