; Haraka connection settings
[main]
; idle timeout (seconds)
inactivity_timeout=300

[headers]
max_lines=1000
max_received=100

[max]
; maximum message size (bytes) - 10MB
bytes=10485760

; maximum SMTP command line length (RFC 5321)
line_length=512

; maximum DATA line length
data_line_length=992

; maximum number of MIME parts
mime_parts=1000

[message]
helo=Haraka at your service.
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=6
deny_chars=0
