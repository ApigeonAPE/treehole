# OpenSMTPD configuration - outbound mail relay
# Listens on the internal interface only (10025), not exposed publicly.
#
# DKIM: OpenSMTPD 7.5 does not support action ... dkim;
# for direct-delivery signing install opensmtpd-filter-dkimsign and use
#   filter "dkimsign" proc-exec "filter-dkimsign -d <domain> -s <selector> -k <key>"
# DKIM is currently handled by Mailgun, so this only relays.

# listen address - all internal interfaces
listen on 0.0.0.0 port 10025

# outbound relay (direct MX delivery)
action "relay" relay

# matching rule - accept mail from any internal source
match from any for any action "relay"
